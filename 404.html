<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Página no encontrada</title>
  <link rel="stylesheet" href="estilos/404.css" />
</head>
<body>
  <nav>
    <div class="logotipo">
      <img src="multimedia/logo-globalseguros-2025.svg" alt="Global Seguros Logo" class="logotipo-imagen" style="max-width: 150px;">
    </div>  
  </nav>
 <section class="container">
   <div class="icon">
      <img src="multimedia/404.png" alt="Imagen de error"/>
    </div>
  <div class="div-texto-404">
    <h1 class="numero-error-404">404</h1>
    <h2>Page not found</h2>
    <p class="mensaje">
     La página que buscas no existe o se ha producido otro error.
    </p>
<div class="contenedor-boton">
    <button class="boton">Regresar</button>
</div>
  </div> 
  
</div>
</section>
<script src="scripts/404.js"></script>
</body> 
<script>
  document.querySelector('.boton').addEventListener(
    'click',
    function() {
      window.history.back();
    }
  );
</script>
</html>
