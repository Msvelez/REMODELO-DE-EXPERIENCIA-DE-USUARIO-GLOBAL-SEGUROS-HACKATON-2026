<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Global Seguros</title>
  <link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos/marca.css">
<link rel="stylesheet" href="estilos/checkout.css">
</head>
<body>

  <nav class="navbar">
    <div class="logotipo">
      <img src="multimedia/logo-globalseguros-2025.svg" alt="Global Seguros Logo" class="logotipo-imagen">
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="marketplace.html">Tienda</a></li>
    </ul>
  </nav>

  <div class="checkout-container">
    
    <main class="checkout-principal">
      
      <section class="checkout-card">
        <h2>Datos de Envío</h2>
        <div class="form-grid">
          <div class="form-group">
            <label for="nombre">Nombre Completo *</label>
            <input type="text" id="nombre" placeholder="Juan Pérez García" required>
          </div>
          
          <div class="form-group">
            <label for="telefono">Teléfono *</label>
            <input type="tel" id="telefono" placeholder="310 1234567" required>
          </div>
          
          <div class="form-group full-width">
            <label for="direccion">Dirección *</label>
            <input type="text" id="direccion" placeholder="Calle 123 #45-67" required>
          </div>
          
          <div class="form-group">
            <label for="ciudad">Ciudad *</label>
            <input type="text" id="ciudad" placeholder="Bogotá" required>
          </div>
          
          <div class="form-group">
            <label for="departamento">Departamento *</label>
            <input type="text" id="departamento" placeholder="Cundinamarca" required>
          </div>
        </div>
      </section>

      <section class="checkout-card">
        <h2>Método de Envío</h2>
        <p class="section-subtitle">Selecciona un método:</p>
        
        <div class="metodos-envio-grid">
          <label class="metodo-opcion">
            <input type="radio" name="metodo_envio" value="estandar" checked>
            <div class="metodo-contenido">
              <span class="metodo-icono">📦</span>
              <div class="metodo-detalles">
                <strong>Estándar</strong>
                <span>5-7 días</span>
              </div>
            </div>
          </label>

          <label class="metodo-opcion">
            <input type="radio" name="metodo_envio" value="express">
            <div class="metodo-contenido">
              <span class="metodo-icono">⚡</span>
              <div class="metodo-detalles">
                <strong>Express</strong>
                <span>2-3 días</span>
              </div>
            </div>
          </label>
        </div>
      </section>
    </main>

    <aside class="checkout-sidebar">
      <div class="checkout-card resumen-card">
        <h2>📋 Resumen de Compra</h2>
        
        <div class="resumen-fila">
          <span>Subtotal:</span>
          <span>$0</span>
        </div>
        <div class="resumen-fila">
          <span>Envío:</span>
          <span class="envio-gratis">Gratuito</span>
        </div>
        
        <div class="resumen-total">
          <span>Total:</span>
          <span class="total-monto">$0</span>
        </div>
        
        <button class="btn-pagar">Finalizar y Pagar</button>
      </div>
    </aside>

  </div>

</body>
</html>
