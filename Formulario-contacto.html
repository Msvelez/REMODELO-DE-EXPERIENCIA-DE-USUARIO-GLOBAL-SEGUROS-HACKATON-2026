<!-- FORMULARIO DE CONTACTO -->
<section class="seccion-contacto" id="contacto">
  <div class="contacto-izquierdo">
    <p class="etiqueta">Contáctanos</p>
    <h2 class="seccion-title">¿Tienes alguna pregunta?</h2>
    <p>Completa el formulario y un asesor te responderá pronto.</p>

    <ul class="contacto-info">
      <li> asesores@globalseguros.co</li>
      <li> 601 123 4567</li>
      <li> Lunes a viernes, 8am – 6pm</li>
    </ul>
  </div>

  <div class="contacto-derecho">
    <form id="form-contacto" novalidate>

      <div class="campo" id="campo-nombre">
        <label for="nombre">Nombre completo *</label>
        <input type="text" id="nombre" placeholder="Tu nombre">
        <span class="campo-error" id="err-nombre"></span>
      </div>

      <div class="campo" id="campo-email">
        <label for="email">Correo electrónico *</label>
        <input type="email" id="email" placeholder="tu@correo.com">
        <span class="campo-error" id="err-email"></span>
      </div>

      <div class="campo" id="campo-asunto">
        <label for="asunto">Asunto *</label>
        <select id="asunto">
          <option value="">Seleccionar...</option>
          <option value="cotizacion">Quiero una cotización</option>
          <option value="informacion">Necesito más información</option>
          <option value="soporte">Soporte a mi póliza</option>
          <option value="otro">Otro</option>
        </select>
        <span class="campo-error" id="err-asunto"></span>
      </div>

      <div class="campo" id="campo-mensaje">
        <label for="mensaje">Mensaje *</label>
        <textarea id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
        <span class="campo-error" id="err-mensaje"></span>
      </div>

      <div class="campo campo-check">
        <label>
          <input type="checkbox" id="terminos">
          Acepto la política de privacidad y el tratamiento de mis datos personales.
        </label>
        <span class="campo-error" id="err-terminos"></span>
      </div>

      <button type="submit">Enviar mensaje</button>

      <p class="form-exito" id="form-exito" style="display:none;">
        ¡Mensaje enviado! Te contactaremos pronto.
      </p>

    </form>
  </div>
</section>
